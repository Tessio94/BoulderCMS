server {
    listen 80;
    server_name www.bouldermeet.com;

    # Allow certbot challenge to work
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to non-www
    return 301 http://bouldermeet.com$request_uri;
}

server {
    listen 80;
    server_name bouldermeet.com;

    # certbot challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    return 301 https://bouldermeet.com$request_uri;
}


server {
  listen 443 ssl;
  http2 on;

  ssl_certificate /etc/letsencrypt/live/bouldermeet.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bouldermeet.com/privkey.pem;

  server_name bouldermeet.com;

  client_max_body_size 50M;

  # Serve static files directly
  location /_next/static/ {
    alias /usr/share/nginx/html/_next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public";
  }

   # Serve Payload media files
  location /media/ {
    alias /usr/share/nginx/html/media/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
  }

  # Proxy API requests to Payload backend
  location /api/ {
    proxy_pass http://payload:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy all other requests to Node app
  location / {
    proxy_pass http://payload:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    # Disable buffering to allow streaming responses
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
  }

     location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
}
